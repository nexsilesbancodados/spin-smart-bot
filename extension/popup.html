<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      font-size: 13px;
    }
    .header {
      background: #141414;
      border-bottom: 1px solid #262626;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      width: 30px; height: 30px;
      border-radius: 6px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 12px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .header p { font-size: 10px; color: #737373; margin-top: 2px; }

    .status {
      padding: 12px 16px;
      border-bottom: 1px solid #262626;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #525252;
    }
    .dot.on { background: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); }
    .dot.paused { background: #f59e0b; }
    .status-text { font-size: 12px; font-weight: 600; }
    .status-count { margin-left: auto; font-size: 11px; color: #a3a3a3; font-family: ui-monospace, monospace; }

    .actions {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #262626;
    }
    .btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #262626;
      background: #1a1a1a;
      color: #e5e5e5;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #262626; }
    .btn-primary { background: #f59e0b; color: #0a0a0a; border-color: #f59e0b; }
    .btn-primary:hover { background: #fbbf24; }
    .btn-danger { background: #1a1a1a; color: #f87171; border-color: #3f1d1d; }
    .btn-danger:hover { background: #3f1d1d; color: #fca5a5; }

    .section {
      padding: 12px 16px;
    }
    .section h2 {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #737373;
      margin-bottom: 10px;
    }
    .log {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .log::-webkit-scrollbar { width: 4px; }
    .log::-webkit-scrollbar-thumb { background: #404040; border-radius: 2px; }
    .num {
      width: 28px; height: 28px;
      border-radius: 5px;
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      font-family: ui-monospace, monospace;
    }
    .num.green { background: #16a34a; }
    .num.red { background: #dc2626; }
    .num.black { background: #27272a; }
    .empty {
      text-align: center;
      color: #525252;
      font-size: 11px;
      padding: 30px 0;
    }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #262626;
      font-size: 9px;
      color: #525252;
      text-align: center;
      line-height: 1.5;
    }
    .footer strong { color: #a3a3a3; }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">RV</div>
    <div>
      <h1>Roleta Vision AI</h1>
      <p>Captura de giros · sem previsões</p>
    </div>
  </div>

  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span class="status-text" id="statusText">—</span>
    <span class="status-count" id="statusCount">0</span>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="toggleBtn">Pausar</button>
    <button class="btn btn-danger" id="clearBtn">Limpar log</button>
  </div>

  <div class="section">
    <h2>Últimos giros capturados</h2>
    <div class="log" id="log"></div>
  </div>

  <div class="footer">
    <strong>Dados descritivos</strong> · não preveem o próximo giro<br />
    Vantagem da casa fixa: 2,70%
  </div>

  <script src="popup.js"></script>
</body>
</html>
